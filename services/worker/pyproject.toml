[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medevo-worker"
version = "0.1.0"
description = "FastAPI worker for MedEvo simulations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn>=0.35.0",
  "python-multipart>=0.0.20",
  "pydantic>=2.11.7",
  "requests>=2.32.5",
  "pypdf>=6.1.3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
